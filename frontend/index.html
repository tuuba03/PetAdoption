<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet ChatBot - Lite</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="app">
        <!-- Navigation -->
        <nav class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <span class="text-2xl font-bold text-indigo-600">🐾 PetChatBot</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <template v-if="isLoggedIn">
                            <span class="text-sm font-medium text-gray-500">{{ user?.username }}</span>
                            <button @click="logout" class="text-gray-500 hover:text-gray-700">Çıkış Yap</button>
                        </template>
                        <template v-else>
                            <button @click="currentView = 'login'" :class="{'text-indigo-600': currentView === 'login'}" class="text-gray-500 hover:text-gray-900">Giriş</button>
                            <button @click="currentView = 'register'" :class="{'text-indigo-600': currentView === 'register'}" class="text-gray-500 hover:text-gray-900">Kayıt</button>
                        </template>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            
            <!-- Login View -->
            <div v-if="currentView === 'login'" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md">
                <h2 class="text-2xl font-bold mb-6 text-center">Giriş Yap</h2>
                <form @submit.prevent="login">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Kullanıcı Adı</label>
                        <input v-model="loginForm.username" type="text" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Şifre</label>
                        <input v-model="loginForm.password" type="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition duration-200">Giriş Yap</button>
                </form>
                <p class="mt-4 text-center text-sm text-gray-600">
                    Hesabın yok mu? <a href="#" @click.prevent="currentView = 'register'" class="text-indigo-600 hover:underline">Kayıt Ol</a>
                </p>
            </div>

            <!-- Register View -->
            <div v-if="currentView === 'register'" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md">
                <h2 class="text-2xl font-bold mb-6 text-center">Kayıt Ol</h2>
                <form @submit.prevent="register">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Kullanıcı Adı</label>
                        <input v-model="registerForm.username" type="text" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">E-posta</label>
                        <input v-model="registerForm.email" type="email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Şifre</label>
                        <input v-model="registerForm.password" type="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 transition duration-200">Kayıt Ol</button>
                </form>
                <p class="mt-4 text-center text-sm text-gray-600">
                    Zaten üye misin? <a href="#" @click.prevent="currentView = 'login'" class="text-indigo-600 hover:underline">Giriş Yap</a>
                </p>
            </div>

            <!-- Home View (Pet List) -->
            <div v-if="currentView === 'home'" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                 <!-- Add New Pet Button -->
                 <div @click="currentView = 'createListing'" class="bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition duration-200 min-h-[400px]">
                    <span class="text-4xl mb-2">➕</span>
                    <span class="font-medium text-gray-600">Yeni İlan Ekle</span>
                </div>

                <div v-for="pet in pets" :key="pet.id" class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition duration-200">
                    <img :src="pet.image" :alt="pet.name" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="text-xl font-bold text-gray-900">{{ pet.name }}</h3>
                                <p class="text-sm text-gray-500">{{ pet.breed }} • {{ pet.age }}</p>
                            </div>
                            <span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded-full">{{ pet.city }}</span>
                        </div>
                        <p class="text-gray-600 text-sm mb-4 line-clamp-2">{{ pet.description }}</p>
                        <div class="flex items-center justify-between mt-4 border-t pt-4">
                            <div class="flex items-center text-sm text-gray-500">
                                <img :src="pet.owner.avatar" class="w-6 h-6 rounded-full mr-2">
                                {{ pet.owner.username }}
                            </div>
                            <button class="text-indigo-600 text-sm font-medium hover:text-indigo-800">Detaylar →</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Create Listing View -->
            <div v-if="currentView === 'createListing'" class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Yeni İlan Oluştur</h2>
                    <button @click="currentView = 'home'" class="text-gray-500 hover:text-gray-700">✕ İptal</button>
                </div>
                <form @submit.prevent="createPet">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">İsim</label>
                            <input v-model="petForm.name" type="text" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Tür</label>
                            <input v-model="petForm.type" type="text" placeholder="Kedi, Köpek..." class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Irk</label>
                            <input v-model="petForm.breed" type="text" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Yaş</label>
                            <input v-model="petForm.age" type="text" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Şehir</label>
                            <input v-model="petForm.city" type="text" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                         <div>
                            <label class="block text-gray-700 text-sm font-bold mb-2">Sağlık</label>
                            <input v-model="petForm.health" type="text" class="w-full px-3 py-2 border rounded-lg">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Açıklama</label>
                        <textarea v-model="petForm.description" rows="3" class="w-full px-3 py-2 border rounded-lg"></textarea>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Resim URL</label>
                        <input v-model="petForm.image" type="text" placeholder="https://..." class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">İlanı Yayınla</button>
                </form>
            </div>

        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue

        createApp({
            setup() {
                const currentView = ref('login')
                const isLoggedIn = ref(false)
                const user = ref(null)
                const pets = ref([])
                
                const loginForm = ref({ username: '', password: '' })
                const registerForm = ref({ username: '', email: '', password: '' })
                const petForm = ref({
                    name: '', type: '', breed: '', age: '', city: '', health: '', description: '', image: '', images: [],
                    owner: { username: 'me', avatar: 'https://i.pravatar.cc/150' } 
                })

                // API Base URL (Relative path since we serve from backend)
                const API_URL = '/api' 

                const checkAuth = () => {
                    const token = localStorage.getItem('token')
                    if (token) {
                        const userData = localStorage.getItem('user')
                        if (userData) user.value = JSON.parse(userData)
                        isLoggedIn.value = true
                        currentView.value = 'home'
                        loadPets()
                    }
                }

                const login = async () => {
                    try {
                        const res = await fetch(`${API_URL}/auth/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(loginForm.value)
                        })
                        const data = await res.json()
                        if (res.ok) {
                            localStorage.setItem('token', data.token)
                            localStorage.setItem('user', JSON.stringify(data.user))
                            user.value = data.user
                            isLoggedIn.value = true
                            currentView.value = 'home'
                            loadPets()
                        } else {
                            alert(data.message)
                        }
                    } catch (e) { console.error(e); alert("Hata oluştu") }
                }

                const register = async () => {
                    try {
                        const res = await fetch(`${API_URL}/auth/register`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(registerForm.value)
                        })
                        const data = await res.json()
                        if (res.ok) {
                            alert('Kayıt başarılı! Giriş yapın.')
                            currentView.value = 'login'
                        } else { alert(data.message) }
                    } catch (e) { console.error(e); alert("Hata oluştu") }
                }

                const logout = () => {
                    localStorage.removeItem('token')
                    localStorage.removeItem('user')
                    isLoggedIn.value = false
                    user.value = null
                    currentView.value = 'login'
                }

                const loadPets = async () => {
                    try {
                        const res = await fetch(`${API_URL}/pets`)
                        if (res.ok) pets.value = await res.json()
                    } catch (e) { console.error(e) }
                }

                const createPet = async () => {
                   try {
                        // Inherit current username if available
                        if(user.value) {
                             petForm.value.owner.username = user.value.username;
                             petForm.value.owner.avatar = user.value.avatar;
                        }

                        const res = await fetch(`${API_URL}/pets`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(petForm.value)
                        })
                        if (res.ok) {
                            alert('İlan oluşturuldu!')
                            loadPets()
                            currentView.value = 'home'
                            // Reset form
                            petForm.value = { name: '', type: '', breed: '', age: '', city: '', health: '', description: '', image: '', images: [], owner: { username: 'me', avatar: 'https://i.pravatar.cc/150' }} 
                        }
                    } catch (e) { console.error(e); alert("Hata oluştu") } 
                }

                onMounted(() => {
                    checkAuth()
                })

                return {
                    currentView, isLoggedIn, user, pets,
                    loginForm, registerForm, petForm,
                    login, register, logout, createPet
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
